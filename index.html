  h2 { font-size:19px; font-weight:600; color:var(--acc); margin:24px 0 8px; }
  a.ev { display:flex; gap:12px; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; }
  a.ev img, a.ev .ph { width:64px; height:64px; border-radius:8px; object-fit:cover; flex:none; background:var(--line); }

  .t { font-weight:600; }
  .m { color:var(--mute); font-size:13px; margin-top:2px; }
  .src { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:6px; padding:0 5px; margin-left:4px; }
  .empty { color:var(--mute); text-align:center; margin-top:40px; }
  footer { color:var(--mute); font-size:12px; text-align:center; padding:0 16px 30px; }

// version marker: sxe-v1
const tz = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = new Date(); today.setHours(0,0,0,0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dow = today.getDay();
const ranges = {
  'Upcoming': [today, addDays(today, 3650)],
  'Today': [today, today],
  'This weekend': [(dow === 0 || dow === 6) ? today : addDays(today, 5-dow), addDays(today, (7-dow)%7)],
  'Next 7 days': [today, addDays(today, 6)],
  'Next 30 days': [today, addDays(today, 29)],
  'Last weekend': [addDays(today, -(dow || 7) - 2), addDays(today, -(dow || 7))],
  'Past 15 days': [addDays(today, -15), addDays(today, -1)],
};
let when = 'Upcoming', src = 'All sources', cat = 'All types', q = '';
function chips(el, items, get, set) {
  el.innerHTML = '';
  for (const it of items) {
    const b = document.createElement('button');
    b.className = 'chip' + (get() === it ? ' on' : ''); b.textContent = it;
    b.onclick = () => { set(it); chips(el, items, get, set); render(); };
    el.appendChild(b);
  }
}
const srcNames = ['All sources', ...[...new Set(DATA.events.flatMap(e => e.sources))].sort()];
chips(document.getElementById('when'), Object.keys(ranges), () => when, v => when = v);
chips(document.getElementById('srcs'), srcNames, () => src, v => src = v);
const catOrder = ['Music','Kids & Family','Halloween & Fall','Food & Drink','Arts & Theater','Sports','Outdoors','Community','Nightlife 21+','Business','Other'];
const present = new Set(DATA.events.flatMap(e => e.cats || []));
chips(document.getElementById('cats'), ['All types', ...catOrder.filter(c => present.has(c))], () => cat, v => cat = v);
document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render() {
  const [a, b] = ranges[when];
  const ev = DATA.events.filter(e => {
    const d = tz(e.date);
    if (d < a || d > b) return false;
    if (src !== 'All sources' && !e.sources.includes(src)) return false;
    if (cat !== 'All types' && !(e.cats || []).includes(cat)) return false;
    if (q && !(e.title + ' ' + e.venue + ' ' + e.sources.join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  const list = document.getElementById('list');
  if (!ev.length) { list.innerHTML = '<p class="empty">No events match.</p>'; return; }
  let html = '', last = '';
  for (const e of ev) {
    if (e.date !== last) {
      last = e.date;
      html += '<h2>' + tz(e.date).toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'}) + '</h2>';
    }
    const img = e.image ? '<img loading="lazy" src="' + esc(e.image) + '" alt="">' : '<div class="ph"></div>';
    const meta = [e.time, e.venue].filter(Boolean).map(esc).join(' · ');
    html += '<a class="ev" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + img +
      '<div><div class="t">' + esc(e.title) + '</div><div class="m">' + meta +
      e.sources.map(s => '<span class="src">' + esc(s) + '</span>').join('') + '</div></div></a>';
  }
  list.innerHTML = html;
}
document.getElementById('sub').textContent = DATA.events.filter(e => tz(e.date) >= today).length + ' upcoming events · updated ' + DATA.updated +
  (DATA.sources.includes('Facebook') ? '' : ' · Not complete: events posted only on Facebook aren’t included yet');
document.getElementById('foot').innerHTML = 'Sources: ' + DATA.sources.map(esc).join(' · ');
render();
